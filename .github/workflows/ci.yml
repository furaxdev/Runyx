name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: No emoji in source/docs
        run: sh scripts/check-no-emoji.sh

  verify-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify every registry entry resolves on Hugging Face
        run: go run ./cmd/verify-registry

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # windows/amd64 is intentionally not in this CGO_ENABLED=0
          # matrix: it needs the real GUI build (cgo + mingw-w64 + the
          # bundled WebView2 headers), built separately below.
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /tmp/runyx-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/runyx

  windows-release:
    # Builds the real Windows deliverable: Runyx.exe with the native
    # WebView2 app window compiled in (cgo + mingw-w64, since this runs
    # on an ubuntu-latest runner rather than on Windows itself), the
    # mascot icon embedded, and no console window on double-click (see
    # scripts/package/windows-release.sh for the details, including the
    # EventToken.h case-mismatch shim mingw-w64 needs for the bundled
    # WebView2.h to compile at all). windows/arm64 is not built here:
    # Ubuntu's mingw-w64 packages only cross-compile to x86_64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install mingw-w64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build and package Runyx.exe
        run: sh scripts/package/windows-release.sh "ci-${{ github.sha }}" /tmp/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: runyx-windows-amd64
          path: |
            /tmp/windows-release/runyx-windows-amd64.zip
            /tmp/windows-release/SHA256SUMS.txt
          if-no-files-found: error

  windows-installer:
    # The real, double-click, click-through-a-wizard Windows installer
    # (scripts/package/runyx.iss, Inno Setup), built and compiled for
    # real on a native Windows runner -- unlike windows-release above
    # (which cross-compiles Runyx.exe itself from Linux via mingw-w64,
    # already proven in CI), there's no practical way to run Inno
    # Setup's compiler anywhere but Windows (or Wine, not attempted).
    # This job builds Runyx.exe natively here too, rather than
    # downloading windows-release's artifact, so it's a self-contained
    # proof that the whole chain -- native cgo build, WebView2 window,
    # icon, installer -- works start to finish on real Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install mingw-w64 (cgo needs a real C/C++ compiler) and Inno Setup
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          choco install innosetup --no-progress -y
      - name: Build Runyx.exe natively
        run: |
          set -eu
          # Same EventToken.h case-mismatch mingw-w64 hits when
          # cross-compiling from Linux (see windows-release.sh) --
          # Chocolatey's mingw package bundles the same upstream
          # mingw-w64 SDK headers, lowercase eventtoken.h included.
          mkdir -p /tmp/mingw-shim
          printf '#include "eventtoken.h"\n' > /tmp/mingw-shim/EventToken.h
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="ci-${{ github.sha }}"
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I/tmp/mingw-shim"
          export CGO_CXXFLAGS="-I/tmp/mingw-shim"
          go build -ldflags "-H=windowsgui -X github.com/furaxdev/runyx/internal/version.Version=$VERSION -X github.com/furaxdev/runyx/internal/version.Commit=$COMMIT -X github.com/furaxdev/runyx/internal/version.BuildDate=$BUILD_DATE" \
            -o scripts/package/Runyx.exe ./cmd/runyx
      - name: Compile the installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.0-ci /DSourceExe=Runyx.exe scripts\package\runyx.iss
      - name: Smoke-test the installer silently, confirm it actually installs
        shell: pwsh
        run: |
          $installer = Get-ChildItem scripts\package\Output\*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $installed = "$env:LOCALAPPDATA\Programs\Runyx\Runyx.exe"
          if (-not (Test-Path $installed)) { throw "Runyx.exe not found after silent install at $installed" }
          & $installed version
          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\Programs\Runyx\unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (Test-Path $installed) { throw "Runyx.exe still present after silent uninstall" }
      - uses: actions/upload-artifact@v4
        with:
          name: runyx-windows-installer
          path: scripts/package/Output/*.exe
          if-no-files-found: error

  linux-release:
    # Builds the real Linux desktop deliverable: a `runyx` binary with
    # the native WebKitGTK app window compiled in (cgo; no cross
    # compiler needed, ubuntu-latest *is* linux/amd64), a .desktop
    # entry + icon set so it shows up as a real application, and both
    # a .deb and an Arch Linux package via nfpm. linux/arm64 isn't
    # built here -- that would need an arm64 GTK/WebKit2GTK sysroot,
    # a much bigger lift than mingw-w64 was for Windows; the plain
    # CGO_ENABLED=0 CLI-only linux/arm64 build above is unaffected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GTK3/WebKit2GTK dev headers and nfpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and package (.deb, Arch Linux, tarball)
        run: sh scripts/package/linux-release.sh "ci-${{ github.sha }}" /tmp/linux-release
      - name: Install and smoke-test the built .deb on this runner
        run: |
          sudo dpkg -i /tmp/linux-release/*.deb
          runyx version
          test -f /usr/share/applications/runyx.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/runyx.png
          sudo dpkg -r runyx
      - uses: actions/upload-artifact@v4
        with:
          name: runyx-linux-amd64
          path: |
            /tmp/linux-release/*.deb
            /tmp/linux-release/*.pkg.tar.zst
            /tmp/linux-release/runyx-linux-amd64.tar.gz
            /tmp/linux-release/SHA256SUMS.txt
          if-no-files-found: error

  darwin-release:
    # Builds the real macOS deliverable on actual macOS runners (no
    # cross-compile trickery needed, or possible, for a cgo + Cocoa/
    # WebKit build): a genuine Runyx.app bundle with the native window
    # compiled in and a real .icns generated from the mascot icon via
    # the standard sips/iconutil toolchain. One job per arch, each
    # building natively on a runner of that architecture -- GOARCH set
    # to amd64/arm64 would still need the other arch's clang target,
    # which cgo cross-arch builds don't handle for free the way plain
    # Go cross-compilation does.
    strategy:
      matrix:
        include:
          - runner: macos-13 # Intel
            goarch: amd64
          - runner: macos-14 # Apple Silicon
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package Runyx.app + installer .pkg
        run: sh scripts/package/macos-release.sh "ci-${{ github.sha }}" /tmp/darwin-release
      - name: Smoke-test the .pkg installer, confirm it actually installs
        run: |
          set -eu
          pkg="$(ls /tmp/darwin-release/*.pkg)"
          sudo installer -pkg "$pkg" -target /
          test -d /Applications/Runyx.app
          /Applications/Runyx.app/Contents/MacOS/Runyx version
          sudo rm -rf /Applications/Runyx.app
      - uses: actions/upload-artifact@v4
        with:
          name: runyx-darwin-${{ matrix.goarch }}
          path: |
            /tmp/darwin-release/runyx-darwin-${{ matrix.goarch }}.zip
            /tmp/darwin-release/*.pkg
            /tmp/darwin-release/SHA256SUMS.txt
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci
        run: npm ci
      - name: test
        run: npm test
      - name: build
        run: npm run build

  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # android-actions/setup-android@v3 defaults to installing the
      # legacy "tools" package, which no longer exists in the SDK
      # repository and makes the action fail outright. Install just
      # the cmdline-tools + the specific packages we need instead.
      - name: Install Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: gradlew assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
